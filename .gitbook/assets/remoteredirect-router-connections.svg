<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="500" viewBox="0 60 1800 500"><style>text{font-family:Arial,Helvetica,sans-serif}.t{font-size:23px;font-weight:600;fill:#1b2533}.s{font-size:18px;fill:#5d6b7e}.c{font-size:18px;fill:#5d6b7e;font-weight:500}.card{fill:#fff;stroke:#d5deea;stroke-width:2}.i{fill:none;stroke:#2b67b5;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.l{fill:none;stroke:#2b67b5;stroke-width:3}.n{font-size:19px;fill:#1f4f8f;font-weight:500}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b67b5"/></marker></defs><rect y="60" width="1800" height="500" fill="#fff"/><line class="l" x1="346" y1="240" x2="504" y2="240" marker-start="url(#a)" marker-end="url(#a)"/><text class="c" x="425" y="222" text-anchor="middle">Internet</text><line class="l" x1="806" y1="240" x2="964" y2="240" marker-start="url(#a)" marker-end="url(#a)"/><text class="c" x="885" y="204" text-anchor="middle">Mobile, Wi-Fi</text><text class="c" x="885" y="226" text-anchor="middle">or Ethernet</text><line class="l" x1="1260" y1="240" x2="1404" y2="240" marker-end="url(#a)"/><text class="c" x="1335" y="222" text-anchor="middle">RS232</text><rect class="card" x="50" y="90" width="290" height="300" rx="18"/><g transform="translate(145 122)"><rect class="i" x="0" y="0" width="100" height="74" rx="9"/><line class="i" x1="0" y1="22" x2="100" y2="22"/><circle cx="13" cy="11" r="3" fill="#2b67b5"/><circle cx="25" cy="11" r="3" fill="#2b67b5"/><line class="i" x1="16" y1="38" x2="84" y2="38"/><line class="i" x1="16" y1="54" x2="60" y2="54"/></g><text class="t" x="195" y="246" text-anchor="middle">Web browser</text><text class="s" x="195" y="284" text-anchor="middle">Control scenes and</text><text class="s" x="195" y="308" text-anchor="middle">settings from anywhere</text><rect class="card" x="510" y="90" width="290" height="300" rx="18"/><g transform="translate(601 124)"><path class="i" d="M30 70H84C98 70 108 60 108 47C108 34 98 25 86 24C82 10 70 2 57 2C42 2 30 12 27 26C14 27 4 36 4 48C4 60 15 70 30 70Z"/></g><text class="t" x="655" y="246" text-anchor="middle">RemoteRedirect</text><text class="s" x="655" y="284" text-anchor="middle">Web service that sends</text><text class="s" x="655" y="308" text-anchor="middle">the display data</text><rect class="card" x="970" y="90" width="290" height="300" rx="18"/><g transform="translate(1059 116)"><rect class="i" x="0" y="48" width="112" height="44" rx="9"/><line class="i" x1="24" y1="48" x2="16" y2="4"/><line class="i" x1="88" y1="48" x2="96" y2="4"/><circle cx="24" cy="70" r="4" fill="#2b67b5"/><circle cx="42" cy="70" r="4" fill="#2b67b5"/><line class="i" x1="66" y1="70" x2="92" y2="70"/></g><text class="t" x="1115" y="246" text-anchor="middle">RS232 router</text><text class="s" x="1115" y="284" text-anchor="middle">Passes the data on to</text><text class="s" x="1115" y="308" text-anchor="middle">the display board</text><rect class="card" x="1410" y="90" width="340" height="300" rx="18"/><rect x="1450" y="130" width="260" height="76" rx="8" fill="#14181f"/><text x="1580" y="183" text-anchor="middle" style="font-family:Menlo,Consolas,monospace;font-size:46px;font-weight:700;letter-spacing:3px" fill="#ff4b3e">16:08:10</text><text class="t" x="1580" y="246" text-anchor="middle">Display board</text><text class="s" x="1580" y="284" text-anchor="middle">FDS MLED, ALGE D-Line</text><text class="s" x="1580" y="308" text-anchor="middle">or Microtab via RS232</text><rect x="50" y="440" width="1700" height="84" rx="14" fill="#eaf1fb"/><text class="n" x="900" y="475" text-anchor="middle">The web service sends the display data through the router to the display board.</text><text class="n" x="900" y="502" text-anchor="middle">This needs a good internet connection. With weak reception, the app is more suitable.</text></svg>