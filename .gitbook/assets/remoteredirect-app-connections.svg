<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="500" viewBox="0 60 1800 500"><style>text{font-family:Arial,Helvetica,sans-serif}.t{font-size:23px;font-weight:600;fill:#1b2533}.s{font-size:18px;fill:#5d6b7e}.c{font-size:18px;fill:#5d6b7e;font-weight:500}.card{fill:#fff;stroke:#d5deea;stroke-width:2}.pill{fill:#f3f7fc;stroke:#c4d4e8;stroke-width:2}.pt{font-size:20px;font-weight:600;fill:#1b2533}.ps{font-size:16px;fill:#2b67b5;font-weight:500}.i{fill:none;stroke:#2b67b5;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.l{fill:none;stroke:#2b67b5;stroke-width:3}.n{font-size:19px;fill:#1f4f8f;font-weight:500}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2b67b5"/></marker></defs><rect width="1800" height="590" fill="#fff"/><line class="l" x1="296" y1="240" x2="414" y2="240" marker-start="url(#a)" marker-end="url(#a)"/><text class="c" x="355" y="222" text-anchor="middle">Internet</text><line class="l" x1="666" y1="240" x2="784" y2="240" marker-start="url(#a)" marker-end="url(#a)"/><text class="c" x="725" y="204" text-anchor="middle">Mobile</text><text class="c" x="725" y="226" text-anchor="middle">or Wi-Fi</text><path class="l" d="M1000 240H1022C1046 240 1046 130 1070 130"/><path class="l" d="M1000 240H1070"/><path class="l" d="M1000 240H1022C1046 240 1046 350 1070 350"/><path class="l" d="M1340 130C1372 130 1372 240 1400 240"/><path class="l" d="M1340 240H1400"/><path class="l" d="M1340 350C1372 350 1372 240 1400 240" /><line class="l" x1="1390" y1="240" x2="1408" y2="240" marker-end="url(#a)"/><rect class="card" x="50" y="90" width="240" height="300" rx="18"/><g transform="translate(120 122)"><rect class="i" x="0" y="0" width="100" height="74" rx="9"/><line class="i" x1="0" y1="22" x2="100" y2="22"/><circle cx="13" cy="11" r="3" fill="#2b67b5"/><circle cx="25" cy="11" r="3" fill="#2b67b5"/><line class="i" x1="16" y1="38" x2="84" y2="38"/><line class="i" x1="16" y1="54" x2="60" y2="54"/></g><text class="t" x="170" y="246" text-anchor="middle">Web browser</text><text class="s" x="170" y="284" text-anchor="middle">Control scenes and</text><text class="s" x="170" y="308" text-anchor="middle">settings from</text><text class="s" x="170" y="332" text-anchor="middle">anywhere</text><rect class="card" x="420" y="90" width="240" height="300" rx="18"/><g transform="translate(486 124)"><path class="i" d="M30 70H84C98 70 108 60 108 47C108 34 98 25 86 24C82 10 70 2 57 2C42 2 30 12 27 26C14 27 4 36 4 48C4 60 15 70 30 70Z"/></g><text class="t" x="540" y="246" text-anchor="middle">RemoteRedirect</text><text class="s" x="540" y="284" text-anchor="middle">Web service with</text><text class="s" x="540" y="308" text-anchor="middle">your links, scenes</text><text class="s" x="540" y="332" text-anchor="middle">and scripts</text><rect class="card" x="790" y="90" width="210" height="300" rx="18"/><g transform="translate(866 116)"><rect class="i" x="0" y="0" width="58" height="96" rx="10"/><line class="i" x1="22" y1="85" x2="36" y2="85"/><line class="i" x1="13" y1="30" x2="45" y2="30"/><line class="i" x1="13" y1="46" x2="36" y2="46"/></g><text class="t" x="895" y="246" text-anchor="middle">Phone or tablet</text><text class="s" x="895" y="284" text-anchor="middle">Android, iPhone</text><text class="s" x="895" y="308" text-anchor="middle">or iPad. Generates</text><text class="s" x="895" y="332" text-anchor="middle">the display data</text><rect class="pill" x="1070" y="90" width="270" height="80" rx="14"/><text class="pt" x="1205" y="125" text-anchor="middle">USB-RS232 adapter</text><text class="ps" x="1205" y="151" text-anchor="middle">Android</text><rect class="pill" x="1070" y="200" width="270" height="80" rx="14"/><text class="pt" x="1205" y="235" text-anchor="middle">Bluetooth adapter</text><text class="ps" x="1205" y="261" text-anchor="middle">Android, iPhone, iPad</text><rect class="pill" x="1070" y="310" width="270" height="80" rx="14"/><text class="pt" x="1205" y="345" text-anchor="middle">Network converter</text><text class="ps" x="1205" y="371" text-anchor="middle">Android, iPhone, iPad</text><rect class="card" x="1410" y="90" width="340" height="300" rx="18"/><rect x="1450" y="130" width="260" height="76" rx="8" fill="#14181f"/><text x="1580" y="183" text-anchor="middle" style="font-family:Menlo,Consolas,monospace;font-size:46px;font-weight:700;letter-spacing:3px" fill="#ff4b3e">16:08:10</text><text class="t" x="1580" y="246" text-anchor="middle">Display board</text><text class="s" x="1580" y="284" text-anchor="middle">FDS MLED, ALGE D-Line</text><text class="s" x="1580" y="308" text-anchor="middle">or Microtab via RS232</text><rect x="50" y="440" width="1700" height="84" rx="14" fill="#eaf1fb"/><text class="n" x="900" y="475" text-anchor="middle">The phone or tablet generates the display data itself.</text><text class="n" x="900" y="502" text-anchor="middle">The internet is only needed to receive changes, so a weak connection does not interrupt the display.</text></svg>